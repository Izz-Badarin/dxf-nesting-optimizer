[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf-nesting-optimizer"
version = "0.1.0"
description = "Dual-strategy DXF nesting optimizer with comparative analysis for CNC sheet cutting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Izz Badarin" }]
keywords = ["dxf", "nesting", "cnc", "optimization", "woodworking", "sheet-cutting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
dxfnest = "nesting.cli:main"

[project.urls]
Homepage = "https://github.com/Izz-Badarin/dxf-nesting-optimizer"
Issues = "https://github.com/Izz-Badarin/dxf-nesting-optimizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nesting = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
