name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gui extra included so mypy can type-check nesting/gui with its real deps
      - run: pip install -e ".[dev,gui]"
      - run: ruff format --check src tests examples
      - run: ruff check src tests examples
      - name: Run mypy
        run: |
          set -o pipefail
          mypy src | tee mypy-output.txt
      - name: Report mypy output on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "mypy failed on $COMMIT:"
            echo '```text'
            cat mypy-output.txt
            echo '```'
          } > comment.md
          gh pr comment "$NUMBER" --repo "$REPO" --body-file comment.md

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=nesting --cov-report=term-missing -q

  gadget:
    name: najjar-pro core (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Unit tests (headless gadget core)
        run: lua5.4 gadget/tests/run_tests.lua
      - name: Package NajjarPro.vgadget
        run: sh tools/package-gadget.sh
      - name: Smoke test - generate demo cabinet in all languages
        run: |
          cd gadget
          lua5.4 main.lua templates/euro-base-900.json out en
          lua5.4 main.lua templates/euro-base-900.json out ar
          lua5.4 main.lua templates/euro-base-900.json out he
          lua5.4 main.lua templates/wardrobe-zones.json out en
          lua5.4 main.lua templates/kitchen-mixed.json out en
          lua5.4 main.lua templates/kitchen-job.json out en
          lua5.4 main.lua templates/base-plinth.json out en
